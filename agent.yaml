# Gemma 4 Developer Agent Competition — root agent config (ADK Agent Config format)
#
# MODEL CHOICE: using gemma-4-e4b for the free-Kaggle plan (fast decode => more
# tasks finished in the 12h budget; cheap/fast to QLoRA on free GPU quota).
# To switch back to the large model, change the line below to:
#   model: gemma-4-31b-it-qat-w4a16-ct
# (All agents in the submission MUST use the SAME model.)
name: swe_baseline_agent
model: gemma-4-e4b-it-qat-w4a16-ct

# Single LoRA adapter NAME (resolved under adapters/main_lora/).
# Comment this out for a zero-adapter baseline run (pure prompt-engineered).
adapter: main_lora

instruction: !include prompts/system.md

tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true

generate_content_config: !include configs/sampling.yaml
